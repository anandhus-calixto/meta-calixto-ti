#@TYPE: Machine
#@NAME: AM335x VERSA NXT 512
#@DESCRIPTION: Machine configuration for the TI AM335x

require conf/machine/include/ti33x.inc

MACHINE_FEATURES += "screen touchscreen"

IMAGE_FSTYPES += "ubifs ubi"

UBOOT_MACHINE = "am335x_versa_nxt512_defconfig"
# Normally AM335 boards use ttyS0, but ICE uses ttyS3, so try both
SERIAL_CONSOLES = "115200;ttyS0 115200;ttyS3"

KERNEL_DEVICETREE = "am335x-calixto-nxt512.dtb"
UBOOT_EXTLINUX_BOOT_FILES:remove = "${DEVICETREE_FILES}"
MKUBIFS_ARGS ?= "-F -m 2048 -e 126976 -c 18000"
UBINIZE_ARGS ?= "-m 2048 -p 128KiB -s 512 -O 2048"

require create-calixto-image.inc
IMAGE_POSTPROCESS_COMMAND += "create_am335x_versa_image; "
